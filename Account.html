<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Classroom.AI Account Settings — manage your personal information and profile." />
  <title>Account Settings – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        
        <h1 class="page-title">👤 Account Settings</h1>
        <p class="page-subtitle">Manage your personal information and profile preferences.</p>

        <div class="tool-layout">
          <div class="tool-panel">
            <h2 class="tool-panel-header">Personal Information</h2>
            
            <div class="input-group">
              <label for="displayName">Display Name</label>
              <input id="displayName" type="text" class="input" placeholder="Your full name" />
            </div>

            <div class="input-group" style="margin-top:1.25rem;">
              <label for="accountEmail">Email Address</label>
              <input id="accountEmail" type="email" class="input" readonly style="opacity:0.7;cursor:not-allowed;" />
              <p class="text-muted" style="font-size:0.75rem;margin-top:0.375rem;">Email cannot be changed directly.</p>
            </div>

            <div class="input-group" style="margin-top:1.25rem;">
              <label for="accountBio">Bio</label>
              <textarea id="accountBio" class="textarea" rows="4" placeholder="Tell us about yourself..."></textarea>
              <p id="bioCounter" class="text-muted" style="font-size:0.75rem;margin-top:0.375rem;text-align:right;">0 / 150</p>
            </div>

            <button id="saveAccountBtn" class="btn btn-primary" style="margin-top:1.5rem;" onclick="saveAccountDetails()">Save Profile</button>
          </div>

          <div class="tool-panel">
            <h2 class="tool-panel-header">Security & Preferences</h2>
            
            <div class="card" style="padding:1.25rem;margin-bottom:1.25rem;">
              <h3 style="font-size:1rem;margin-bottom:1rem;">Account Security</h3>
              <button class="btn btn-secondary btn-sm" style="width:100%;margin-bottom:0.75rem;" onclick="showToast('Password reset email sent!', 'info')">Reset Password</button>
              <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="showToast('2FA setup coming soon.', 'info')">Enable Two-Factor Auth</button>
            </div>

            <div class="card" style="padding:1.25rem;">
              <h3 style="font-size:1rem;margin-bottom:1rem;">Danger Zone</h3>
              <p class="text-muted" style="font-size:0.875rem;margin-bottom:1rem;">Once you delete your account, there is no going back. Please be certain.</p>
              <button class="btn btn-secondary btn-sm" style="width:100%;color:var(--color-error);border-color:var(--color-error);" onclick="confirmDeleteAccount()">Delete Account</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initSidebar } from "./js/sidebar.js";
    import { initTheme } from "./js/theme.js";
    import { showToast, setButtonLoading } from "./js/ui.js";
    import { auth, db, onAuthStateChanged } from "./js/firebase-config.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    initTheme();
    initSidebar();

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "home.html";
      currentUser = user;
      document.getElementById("displayName").value = user.displayName || "";
      document.getElementById("accountEmail").value = user.email || "";
      
      // Load bio from Firestore
      try {
        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);
        if (docSnap.exists()) {
          const bio = docSnap.data().bio || "";
          document.getElementById("accountBio").value = bio;
          updateBioCounter(bio);
        }
      } catch (e) { console.error("Error loading bio:", e); }
    });

    const bioInput = document.getElementById("accountBio");
    bioInput.addEventListener("input", (e) => {
      const val = e.target.value;
      if (val.length > 150) {
        e.target.value = val.substring(0, 150);
      }
      updateBioCounter(e.target.value);
    });

    function updateBioCounter(text) {
      document.getElementById("bioCounter").textContent = `${text.length} / 150`;
    }

    window.saveAccountDetails = async function() {
      if (!currentUser) return;
      const name = document.getElementById("displayName").value.trim();
      const bio = document.getElementById("accountBio").value.trim();
      const btn = document.getElementById("saveAccountBtn");

      setButtonLoading(btn, true);
      try {
        await updateProfile(currentUser, { displayName: name });
        // Update bio in Firestore
        const userRef = doc(db, "users", currentUser.uid);
        await updateDoc(userRef, { bio, updatedAt: new Date().toISOString() });
        
        showToast("Profile updated successfully! ✨", "success");
      } catch (e) {
        console.error(e);
        showToast("Failed to update profile.", "error");
      } finally {
        setButtonLoading(btn, false, "Save Profile");
      }
    };

    window.confirmDeleteAccount = function() {
      if (confirm("Are you absolutely sure? This will permanently delete your account and all saved projects.")) {
        showToast("Account deletion requested. Please contact support to complete.", "warning");
      }
    };
  </script>
</body>
</html>
