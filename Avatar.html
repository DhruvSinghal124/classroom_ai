<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Classroom.AI Avatar Settings — personalize your profile picture." />
  <title>Avatar Manager – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .avatar-manager-card { max-width: 480px; margin: 0 auto; text-align: center; }
    .avatar-preview-lg { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid var(--color-accent); margin: 0 auto 1.5rem; display: block; box-shadow: var(--shadow-lg); }
    .upload-dropzone { border: 2px dashed var(--color-border); border-radius: var(--radius-lg); padding: 2rem; cursor: pointer; transition: all var(--transition-fast); margin-bottom: 1.5rem; }
    .upload-dropzone:hover, .upload-dropzone.dragover { border-color: var(--color-accent); background: var(--color-bg-hover); }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        
        <h1 class="page-title">🖼️ Avatar Manager</h1>
        <p class="page-subtitle">Personalize your classroom presence with a custom profile picture.</p>

        <div class="avatar-manager-card">
          <div class="card" style="padding: 2.5rem;">
            <img id="currentAvatar" src="user.png" alt="Current Avatar" class="avatar-preview-lg" />
            
            <label for="avatarInput" class="upload-dropzone" id="dropzone">
              <p class="text-muted">📁 Click or drag image to upload</p>
              <input type="file" id="avatarInput" accept="image/*" style="display: none;" />
            </label>

            <div style="display: grid; gap: 0.75rem;">
              <button id="uploadBtn" class="btn btn-primary" onclick="uploadAvatar()">Upload & Save</button>
              <button id="removeBtn" class="btn btn-secondary" onclick="removeAvatar()">Remove Avatar</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initSidebar } from "./js/sidebar.js";
    import { initTheme } from "./js/theme.js";
    import { showToast, setButtonLoading } from "./js/ui.js";
    import { auth, storage, db, onAuthStateChanged } from "./js/firebase-config.js";
    import { ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";
    import { updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    initTheme();
    initSidebar();

    let currentUser = null;
    let selectedFile = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = "home.html";
      currentUser = user;
      if (user.photoURL) document.getElementById("currentAvatar").src = user.photoURL;
    });

    const input = document.getElementById("avatarInput");
    const dropzone = document.getElementById("dropzone");

    input.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!file.type.startsWith("image/")) return showToast("Please select an image file.", "warning");
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => document.getElementById("currentAvatar").src = e.target.result;
      reader.readAsDataURL(file);
    }

    window.uploadAvatar = async function() {
      if (!selectedFile) return showToast("Please select an image first.", "warning");
      if (!currentUser) return;

      const btn = document.getElementById("uploadBtn");
      setButtonLoading(btn, true);

      try {
        const fileRef = ref(storage, `avatars/${currentUser.uid}`);
        await uploadBytes(fileRef, selectedFile);
        const url = await getDownloadURL(fileRef);
        
        await updateProfile(currentUser, { photoURL: url });
        await setDoc(doc(db, "users", currentUser.uid), { avatarUrl: url }, { merge: true });
        
        showToast("Avatar updated successfully! 🎨", "success");
        selectedFile = null;
      } catch (e) {
        console.error(e);
        showToast("Failed to upload avatar.", "error");
      } finally {
        setButtonLoading(btn, false, "Upload & Save");
      }
    };

    window.removeAvatar = async function() {
      if (!currentUser || !currentUser.photoURL) return showToast("No custom avatar to remove.", "info");
      if (!confirm("Are you sure you want to remove your avatar?")) return;

      const btn = document.getElementById("removeBtn");
      setButtonLoading(btn, true);

      try {
        const fileRef = ref(storage, `avatars/${currentUser.uid}`);
        try { await deleteObject(fileRef); } catch (e) { console.warn("File not found in storage, proceeding..."); }
        
        await updateProfile(currentUser, { photoURL: null });
        await setDoc(doc(db, "users", currentUser.uid), { avatarUrl: null }, { merge: true });
        
        document.getElementById("currentAvatar").src = "user.png";
        showToast("Avatar removed.", "info");
      } catch (e) {
        console.error(e);
        showToast("Failed to remove avatar.", "error");
      } finally {
        setButtonLoading(btn, false, "Remove Avatar");
      }
    };
  </script>
</body>
</html>
