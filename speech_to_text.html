<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Voice to text — convert speech into text with AI assistance." />
  <title>Voice to Text – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem;}
    @media(max-width:900px){.voice-grid{grid-template-columns:1fr;}}
    .voice-panel{display:flex;flex-direction:column;gap:1rem;padding:1.5rem;min-height:400px;}
    .voice-btns{display:flex;gap:0.75rem;}
    .btn-record{background:#10b981;color:#fff;} .btn-record:hover{background:#059669;}
    .btn-stop{background:#ef4444;color:#fff;} .btn-stop:hover{background:#dc2626;}
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <h1 class="page-title">🎤 Voice to Text</h1>
        <p class="page-subtitle">Record speech, get text, and process it with AI.</p>
        <div class="voice-grid">
          <div class="card voice-panel">
            <h2 style="font-size:1.25rem;font-weight:600;">Speech Input</h2>
            <label for="transcript" class="sr-only">Speech transcript</label>
            <textarea id="transcript" class="tool-textarea" placeholder="Your speech will appear here..." aria-label="Speech transcript"></textarea>
            <div class="voice-btns">
              <button class="btn btn-record btn-sm" onclick="startRecording()" aria-label="Start recording">🎙 Start</button>
              <button class="btn btn-stop btn-sm" onclick="stopRecording()" aria-label="Stop recording">⏹ Stop</button>
            </div>
            <button id="runBtn" class="btn btn-primary" onclick="sendToAI()">Run AI</button>
          </div>
          <div class="card voice-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h2 style="font-size:1.25rem;font-weight:600;">AI Response</h2>
              <button class="btn btn-secondary btn-sm" onclick="saveTextAsFile()">💾 Save Text</button>
            </div>
            <div id="ai-response" class="tool-output" aria-live="polite">AI-generated response will appear here...</div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { apiRequest } from "./js/api.js"; import { showToast, setButtonLoading } from "./js/ui.js";
    initTheme(); initSidebar();

    let recognition;
    window.startRecording = function() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return showToast("Speech recognition not supported in this browser.", "error");
      recognition = new SR();
      recognition.lang = "en-US"; recognition.interimResults = true; recognition.continuous = true;
      recognition.onresult = (e) => {
        let text = "";
        for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
        document.getElementById("transcript").value = text;
      };
      recognition.start();
      showToast("Recording started...", "info");
    };

    window.stopRecording = function() {
      if (recognition) { recognition.stop(); showToast("Recording stopped.", "info"); }
    };

    window.sendToAI = async function() {
      const text = document.getElementById("transcript").value.trim();
      const out = document.getElementById("ai-response");
      const btn = document.getElementById("runBtn");
      if (!text) return showToast("Speak or type something first.", "warning");
      setButtonLoading(btn, true);
      out.textContent = "🤔 Thinking...";
      try { const data = await apiRequest("/ai-respond", { prompt: text }); out.textContent = data.response || "No response."; }
      catch { out.textContent = "Error getting AI response."; }
      finally { setButtonLoading(btn, false, "Run AI"); }
    };

    window.saveTextAsFile = function() {
      const text = document.getElementById("transcript").value;
      if (!text) return showToast("Nothing to save.", "warning");
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "voice-transcript.txt"; a.click();
      URL.revokeObjectURL(a.href);
      showToast("File downloaded!", "success");
    };
  </script>
</body>
</html>
