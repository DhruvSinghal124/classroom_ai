<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        <h1 class="page-title">🔔 Notifications</h1>
        <p class="page-subtitle">Choose how you want to be notified.</p>
        <div class="tool-layout">
          <div class="tool-panel">
            <h2 class="tool-panel-header">Notification Channels</h2>
            <div class="card" style="padding:1.25rem;">
              <div style="display:grid;gap:1.25rem;">
                <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                  <div><strong>Email Notifications</strong><p class="text-muted" style="font-size:0.75rem;">Receive updates via email</p></div>
                  <input type="checkbox" checked />
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                  <div><strong>Push Notifications</strong><p class="text-muted" style="font-size:0.75rem;">Browser push alerts</p></div>
                  <input type="checkbox" checked />
                </label>
              </div>
              <button class="btn btn-primary" style="margin-top:1.5rem;width:100%;" onclick="showToast('Preferences saved.', 'success')">Save Preferences</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { showToast } from "./js/ui.js"; initTheme(); initSidebar();
  </script>
</body>
</html>
