<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Classroom.AI — Ask questions and get AI-powered answers instantly." />
  <title>Chat – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .chat-layout{display:flex;height:calc(100vh - var(--header-height));padding-top:var(--header-height);}
    .chat-sidebar{width:240px;background:var(--color-bg-secondary);border-right:1px solid var(--color-border);padding:1rem;display:flex;flex-direction:column;overflow-y:auto;}
    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-container{flex:1;display:flex;flex-direction:column;padding:1.5rem;gap:1rem;overflow-y:auto;scroll-behavior:smooth;}
    .chat-bubble{padding:1rem 1.25rem;border-radius:var(--radius-lg);max-width:75%;line-height:1.6;font-size:0.9375rem;animation:fadeUp 0.3s ease;word-break:break-word;white-space:pre-wrap;}
    .chat-bubble.user{align-self:flex-end;background:var(--gradient-primary);color:#fff;}
    .chat-bubble.ai{align-self:flex-start;background:var(--color-bg-card);color:var(--color-text-primary);border:1px solid var(--color-border);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .chat-input-bar{position:sticky;bottom:0;padding:1rem 1.5rem;background:var(--color-bg-primary);border-top:1px solid var(--color-border);}
    .chat-input-wrap{display:flex;gap:0.5rem;max-width:720px;margin:0 auto;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:0.375rem 0.375rem 0.375rem 1.25rem;}
    .chat-input-wrap:focus-within{border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-light);}
    .chat-input{flex:1;border:none;background:none;color:var(--color-text-primary);font-size:1rem;outline:none;padding:0.5rem 0;}
    .chat-input::placeholder{color:var(--color-text-muted);}
    .chat-send{background:var(--gradient-primary);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:transform var(--transition-fast);}
    .chat-send:hover{transform:scale(1.08);}
    .chat-intro{text-align:center;padding:3rem 1rem;color:var(--color-text-secondary);font-size:1.5rem;font-weight:600;}
    .chat-history-item{padding:0.5rem 0.75rem;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:0.375rem;font-size:0.8125rem;color:var(--color-text-secondary);background:var(--color-bg-primary);transition:background var(--transition-fast);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .chat-history-item:hover{background:var(--color-bg-hover);color:var(--color-text-primary);}
    .loading-dot{align-self:flex-start;width:2rem;height:2rem;background:var(--color-accent);border-radius:50%;animation:pulse 1s infinite ease-in-out;}
    @media(max-width:768px){.chat-sidebar{display:none;}.chat-layout{margin-left:0;}}
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" style="margin-left:var(--sidebar-width);">
      <div class="chat-layout">
        <!-- Chat History Sidebar -->
        <aside class="chat-sidebar" aria-label="Chat history">
          <button class="btn btn-primary btn-sm btn-pill" style="width:100%;margin-bottom:0.5rem;" onclick="startNewChat()">+ New Chat</button>
          <button class="btn btn-secondary btn-sm btn-pill" style="width:100%;margin-bottom:1rem;" onclick="clearChatHistory()">🗑 Clear History</button>
          <div id="chatHistory" role="list" aria-label="Previous chats"></div>
        </aside>

        <!-- Main Chat Area -->
        <div class="chat-main" role="main" id="main-content">
          <div id="introText" class="chat-intro" aria-live="polite">What's on your mind today?</div>
          <div id="chatBox" class="chat-container" role="log" aria-label="Chat messages" aria-live="polite"></div>
          <div class="chat-input-bar">
            <form class="chat-input-wrap" onsubmit="submitQuestion(event)" role="search">
              <label for="questionInput" class="sr-only">Ask a question</label>
              <input type="text" id="questionInput" class="chat-input" placeholder="Ask anything..." autocomplete="off" maxlength="1000" />
              <button type="submit" class="chat-send" aria-label="Send message">➤</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initSidebar } from "./js/sidebar.js";
    import { initTheme } from "./js/theme.js";
    import { apiRequest } from "./js/api.js";
    initTheme();
    initSidebar();

    const chatBox = document.getElementById("chatBox");
    const chatHistory = document.getElementById("chatHistory");
    const introText = document.getElementById("introText");

    let chatCounter = 1;
    let currentChatId = null;
    let chatData = JSON.parse(localStorage.getItem("chatData") || "{}");
    let chatTitles = JSON.parse(localStorage.getItem("chatTitles") || "{}");

    window.onload = () => {
      Object.keys(chatTitles).forEach(id => addChatItem(id, chatTitles[id]));
      if (!currentChatId) startNewChat();
    };

    window.startNewChat = function() {
      currentChatId = "chat_" + Date.now();
      chatData[currentChatId] = [];
      introText.classList.remove("hidden");
      introText.style.display = "";
      addChatItem(currentChatId, "New Chat #" + chatCounter++);
      chatBox.innerHTML = "";
      saveAll();
    };

    function addChatItem(chatId, title) {
      const item = document.createElement("div");
      item.className = "chat-history-item";
      item.textContent = title;
      item.setAttribute("role", "listitem");
      item.setAttribute("tabindex", "0");
      item.onclick = () => loadChat(chatId);
      item.onkeydown = (e) => { if (e.key === "Enter") loadChat(chatId); };
      item.id = "sidebar_" + chatId;
      chatHistory.prepend(item);
    }

    function loadChat(chatId) {
      currentChatId = chatId;
      chatBox.innerHTML = "";
      introText.style.display = "none";
      const messages = chatData[chatId] || [];
      messages.forEach(msg => {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + msg.role;
        bubble.textContent = msg.text;
        chatBox.appendChild(bubble);
      });
      setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
    }

    window.submitQuestion = async function(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("questionInput");
      const question = input.value.trim();
      if (!question || !currentChatId) return;

      introText.style.display = "none";

      // User bubble
      const userBubble = document.createElement("div");
      userBubble.className = "chat-bubble user";
      userBubble.textContent = question;
      chatBox.appendChild(userBubble);
      chatData[currentChatId].push({ role: "user", text: question });
      input.value = "";

      // Update sidebar title
      if (!chatTitles[currentChatId] || chatTitles[currentChatId].startsWith("New Chat")) {
        const preview = question.length > 25 ? question.slice(0, 25) + "..." : question;
        chatTitles[currentChatId] = preview;
        const el = document.getElementById("sidebar_" + currentChatId);
        if (el) el.textContent = preview;
      }

      // Loading indicator
      const loading = document.createElement("div");
      loading.className = "loading-dot";
      loading.setAttribute("aria-label", "AI is thinking...");
      chatBox.appendChild(loading);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const data = await apiRequest("/ask", { question: question }, { showError: true });
        loading.remove();
        const aiText = data.answer || "No response received.";
        const aiBubble = document.createElement("div");
        aiBubble.className = "chat-bubble ai";
        aiBubble.textContent = aiText;
        chatBox.appendChild(aiBubble);
        chatData[currentChatId].push({ role: "ai", text: aiText });
        setTimeout(() => aiBubble.scrollIntoView({ behavior: "smooth", block: "end" }), 100);
      } catch (err) {
        loading.remove();
        const errBubble = document.createElement("div");
        errBubble.className = "chat-bubble ai";
        errBubble.textContent = "Sorry, I couldn't process that. Please try again.";
        chatBox.appendChild(errBubble);
      }
      saveAll();
    };

    window.clearChatHistory = function() {
      if (!confirm("Clear all chat history?")) return;
      localStorage.removeItem("chatData");
      localStorage.removeItem("chatTitles");
      chatData = {};
      chatTitles = {};
      chatCounter = 1;
      chatHistory.innerHTML = "";
      chatBox.innerHTML = "";
      introText.style.display = "";
    };

    function saveAll() {
      localStorage.setItem("chatData", JSON.stringify(chatData));
      localStorage.setItem("chatTitles", JSON.stringify(chatTitles));
    }
  </script>
</body>
</html>
