<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI grammar checker — fix spelling and grammar issues instantly." />
  <title>Grammar Checker – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <h1 class="page-title">✅ Grammar Checker</h1>
        <p class="page-subtitle">Fix spelling and grammar issues using AI.</p>
        <div style="max-width:680px;margin:0 auto;">
          <div class="input-group">
            <label for="textInput">Your Text</label>
            <textarea id="textInput" class="textarea" rows="6" placeholder="Paste your sentence or paragraph here..." aria-label="Text to check grammar"></textarea>
          </div>
          <button id="checkBtn" class="btn btn-primary" style="margin-top:1rem;" onclick="checkGrammar()">Check Grammar</button>
          <div id="outputContainer" style="margin-top:2rem;display:none;">
            <div class="card" style="padding:1.5rem;">
              <h3 style="font-size:0.8125rem;color:var(--color-text-muted);margin-bottom:0.75rem;text-align:center;">✅ Corrected Output</h3>
              <div id="output" class="tool-output" style="min-height:120px;" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { apiRequest } from "./js/api.js"; import { showToast, setButtonLoading } from "./js/ui.js";
    initTheme(); initSidebar();

    window.checkGrammar = async function() {
      const text = document.getElementById("textInput").value.trim();
      const out = document.getElementById("output");
      const btn = document.getElementById("checkBtn");
      if (!text) return showToast("Enter some text.", "warning");
      setButtonLoading(btn, true);
      document.getElementById("outputContainer").style.display = "";
      out.innerHTML = '<span class="loading-text">⏳ Checking grammar...</span>';
      try {
        const data = await apiRequest("/grammar", { text });
        out.textContent = data.corrected || "No corrections needed.";
      } catch { out.textContent = "Failed to check grammar."; }
      finally { setButtonLoading(btn, false, "Check Grammar"); }
    };
  </script>
</body>
</html>
