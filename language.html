<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Settings – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        <h1 class="page-title">🌐 App Language</h1>
        <p class="page-subtitle">Select your preferred language for the interface.</p>
        <div class="tool-layout">
          <div class="tool-panel">
            <h2 class="tool-panel-header">Choose Language</h2>
            <div class="card" style="padding:1.25rem;">
              <select id="langSelect" class="input select" style="margin-bottom:1.5rem;">
                <option value="en">English (US)</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
              </select>
              <button class="btn btn-primary" style="width:100%;" onclick="showToast('Language updated.', 'success')">Save Language</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { showToast } from "./js/ui.js"; initTheme(); initSidebar();
  </script>
</body>
</html>
