<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Image to text — extract text from images and get AI insights." />
  <title>Image Preview – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:2rem;text-align:center;cursor:pointer;transition:border-color var(--transition-fast);max-width:680px;margin:0 auto;}
    .upload-area:hover,.upload-area:focus-within{border-color:var(--color-accent);}
    .preview-img{max-height:200px;border-radius:var(--radius-md);border:1px solid var(--color-border);margin:1rem auto;display:block;}
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <h1 class="page-title">🖼️ Image Preview</h1>
        <p class="page-subtitle">Upload an image to extract text and get AI-powered insights.</p>
        <div style="max-width:680px;margin:0 auto;">
          <label for="imageInput" class="upload-area" tabindex="0">
            <p style="color:var(--color-text-secondary);font-size:1rem;">📁 Click or drag an image to upload</p>
            <input id="imageInput" type="file" accept="image/*" style="display:none;" />
          </label>
          <button class="btn btn-primary" style="margin:1rem auto;display:block;" onclick="extractText()">Extract Text</button>

          <div id="outputContainer" style="display:none;margin-top:2rem;">
            <img id="previewImage" class="preview-img" alt="Uploaded image preview" />
            <div class="card" style="padding:1.5rem;margin-bottom:1rem;">
              <h3 style="font-size:0.8125rem;color:var(--color-text-muted);margin-bottom:0.75rem;">📝 Extracted Text</h3>
              <div id="output" class="tool-output" style="min-height:80px;" aria-live="polite"></div>
            </div>
            <div class="card" style="padding:1.5rem;">
              <h3 style="font-size:0.8125rem;color:var(--color-text-muted);margin-bottom:0.75rem;">🤖 AI Response</h3>
              <div id="aiOutput" class="tool-output" style="min-height:80px;" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { apiRequest } from "./js/api.js"; import { showToast } from "./js/ui.js";
    initTheme(); initSidebar();

    let base64Image = "";
    document.getElementById("imageInput").addEventListener("change", function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          base64Image = e.target.result;
          document.getElementById("previewImage").src = base64Image;
          document.getElementById("outputContainer").style.display = "";
          document.getElementById("output").textContent = "";
          document.getElementById("aiOutput").textContent = "";
        };
        reader.readAsDataURL(file);
      }
    });

    window.extractText = async function() {
      if (!base64Image) return showToast("Upload an image first.", "warning");
      const out = document.getElementById("output");
      const aiOut = document.getElementById("aiOutput");
      out.innerHTML = '<span class="loading-text">⏳ Extracting...</span>';
      aiOut.textContent = "";

      try {
        const response = await fetch("https://api.ocr.space/parse/image", {
          method: "POST",
          headers: { apikey: "helloworld", "Content-Type": "application/x-www-form-urlencoded" },
          body: `base64Image=${encodeURIComponent(base64Image)}&language=eng`
        });
        const data = await response.json();
        const text = data?.ParsedResults?.[0]?.ParsedText?.trim() || "";
        if (!text) { out.textContent = "No readable text found."; return; }
        out.textContent = text;
        aiOut.innerHTML = '<span class="loading-text">🤔 Thinking...</span>';
        try {
          const aiData = await apiRequest("/ai-respond", { prompt: text });
          aiOut.textContent = aiData.response || "No AI response.";
        } catch { aiOut.textContent = "Failed to get AI response."; }
      } catch (err) {
        out.textContent = "Error connecting to OCR API.";
        console.error(err);
      }
    };
  </script>
</body>
</html>
