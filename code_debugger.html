<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI code debugger — paste buggy code and get a fixed version." />
  <title>Code Debugger – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>.code-output{font-family:'Fira Code',monospace;color:#86efac;}</style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <h1 class="page-title">🐛 Code Debugger</h1>
        <p class="page-subtitle">Paste buggy code and get a corrected version from AI.</p>
        <div class="tool-layout">
          <div class="tool-panel">
            <label for="instructionInput" class="tool-panel-header">Paste buggy code</label>
            <textarea id="instructionInput" class="tool-textarea" placeholder="Paste your code here..." style="font-family:'Fira Code',monospace;"></textarea>
            <button id="debugBtn" class="btn btn-primary" onclick="debugCode()">Debug</button>
          </div>
          <div class="tool-panel">
            <h2 class="tool-panel-header">Fixed Code</h2>
            <pre id="codeOutput" class="tool-output code-output" aria-live="polite">Debugged output will appear here...</pre>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { apiRequest } from "./js/api.js"; import { showToast, setButtonLoading } from "./js/ui.js";
    initTheme(); initSidebar();

    window.debugCode = async function() {
      const input = document.getElementById("instructionInput").value.trim();
      const out = document.getElementById("codeOutput");
      const btn = document.getElementById("debugBtn");
      if (!input) return showToast("Paste buggy code first.", "warning");
      setButtonLoading(btn, true);
      out.textContent = "⏳ Debugging your code...";
      try { const data = await apiRequest("/debug", { prompt: input }); out.textContent = data.fixed_code || "No fix generated."; }
      catch { out.textContent = "Failed to debug code."; }
      finally { setButtonLoading(btn, false, "Debug"); }
    };
  </script>
</body>
</html>
