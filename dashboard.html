<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Classroom.AI Dashboard — manage your profile and saved projects." />
  <title>Dashboard – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .profile-section{display:flex;align-items:flex-start;gap:1.5rem;margin-bottom:2.5rem;}
    .profile-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--color-accent);}
    .profile-info h2{font-size:1.75rem;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .profile-info p{color:var(--color-text-secondary);font-size:0.875rem;margin-top:0.25rem;}
    .projects-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;}
    .project-card h3{font-size:1rem;margin-bottom:0.375rem;}
    .project-card p{font-size:0.8125rem;color:var(--color-text-muted);}
    .file-item{display:flex;justify-content:space-between;align-items:flex-start;padding:0.75rem;background:var(--color-bg-primary);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:0.5rem;}
    .file-item:hover{border-color:var(--color-border-hover);}
    .file-info{flex:1;cursor:pointer;}
    .file-info strong{font-size:0.875rem;}
    .file-info span{display:block;font-size:0.75rem;color:var(--color-text-muted);margin-top:0.25rem;}
    .delete-file-btn{background:none;border:none;color:var(--color-error);cursor:pointer;padding:0.25rem;opacity:0.7;transition:opacity var(--transition-fast);}
    .delete-file-btn:hover{opacity:1;}
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <!-- Profile -->
        <section class="profile-section" aria-label="User profile">
          <img id="userAvatar" src="user.png" alt="User avatar" class="profile-avatar" />
          <div class="profile-info">
            <h2 id="userName">User Name</h2>
            <p id="userEmail">user@example.com</p>
            <p id="userJoinDate" style="font-size:0.75rem;color:var(--color-text-muted);margin-top:0.5rem;">📅 Joined: ---</p>
          </div>
        </section>

        <!-- Saved Projects -->
        <div class="projects-header">
          <h2 style="font-size:1.5rem;">Saved Projects</h2>
          <button class="btn btn-primary btn-sm" onclick="openModal('projectModal')">+ Create Project</button>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
      </main>
    </div>
  </div>

  <!-- Create Project Modal -->
  <div id="projectModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="projTitle">
    <div class="modal-content">
      <div class="modal-header"><h2 id="projTitle">Create New Project</h2><button class="modal-close" aria-label="Close" onclick="closeModal('projectModal')">&times;</button></div>
      <form id="projectForm">
        <div class="input-group"><label for="projectName">Folder Name</label><input id="projectName" class="input" placeholder="Name of Folder" required /></div>
        <div class="input-group" style="margin-top:1rem;"><label for="projectType">Type</label>
          <select id="projectType" class="input select"><option>Text-Based</option><option>Visual</option><option>Audio</option><option>Code</option></select>
        </div>
        <div class="input-group" style="margin-top:1rem;"><label for="projectDesc">Description (optional)</label><textarea id="projectDesc" class="textarea" rows="2" placeholder="Short description..."></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem;">Save Project</button>
      </form>
    </div>
  </div>

  <!-- Folder View Modal -->
  <div id="folderView" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="folderTitle">
    <div class="modal-content" style="max-width:640px;">
      <div class="modal-header"><h2 id="folderTitle">📁 Folder</h2><button class="modal-close" aria-label="Close" onclick="closeModal('folderView')">&times;</button></div>
      <div id="folderFiles"></div>
    </div>
  </div>

  <!-- File View Modal -->
  <div id="fileViewModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="fileViewTitle">
    <div class="modal-content" style="max-width:800px;max-height:85vh;">
      <div class="modal-header"><h2 id="fileViewTitle">📄 File</h2><button class="modal-close" aria-label="Close" onclick="closeModal('fileViewModal')">&times;</button></div>
      <div id="fileViewContent" class="tool-output" style="min-height:200px;max-height:60vh;"></div>
    </div>
  </div>

  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { showToast, openModal, closeModal } from "./js/ui.js";
    import { auth, db, onAuthStateChanged } from "./js/firebase-config.js";
    import { collection, query, where, getDocs, deleteDoc, doc, addDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    initTheme(); initSidebar();

    // View file
    window.viewFile = async function(folderId, fileId, fileName) {
      try {
        const fileDoc = await getDoc(doc(db, `projects/${folderId}/files`, fileId));
        if (fileDoc.exists()) {
          document.getElementById("fileViewTitle").textContent = `📄 ${fileName}`;
          document.getElementById("fileViewContent").textContent = fileDoc.data().content || "No content";
          openModal("fileViewModal");
        }
      } catch (e) { showToast("Failed to load file.", "error"); console.error(e); }
    };

    // Delete file
    window.deleteFile = async function(folderId, fileId) {
      if (!confirm("Delete this file?")) return;
      try {
        await deleteDoc(doc(db, `projects/${folderId}/files`, fileId));
        showToast("File deleted.", "info");
        const title = document.getElementById("folderTitle").textContent.replace("📁 ", "");
        openFolderById(folderId, title);
      } catch (e) { showToast("Delete failed.", "error"); console.error(e); }
    };

    // Save project
    document.getElementById("projectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return showToast("Sign in first.", "warning");
      try {
        await addDoc(collection(db, "projects"), {
          name: document.getElementById("projectName").value.trim(),
          type: document.getElementById("projectType").value,
          description: document.getElementById("projectDesc").value.trim(),
          uid: user.uid, createdAt: serverTimestamp()
        });
        showToast("Project created!", "success");
        closeModal("projectModal");
        setTimeout(() => location.reload(), 500);
      } catch (e) { showToast("Failed to create project.", "error"); console.error(e); }
    });

    // Auth state
    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "home.html";
      document.getElementById("userName").textContent = user.displayName || "User";
      document.getElementById("userEmail").textContent = user.email;
      document.getElementById("userAvatar").src = user.photoURL || "user.png";
      document.getElementById("userJoinDate").textContent = `📅 Joined: ${new Date(user.metadata.creationTime).toLocaleDateString("en-IN", { year:"numeric", month:"long", day:"numeric" })}`;

      // Load folders
      const grid = document.getElementById("projectsGrid");
      const snap = await getDocs(query(collection(db, "projects"), where("uid", "==", user.uid)));
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const card = document.createElement("div");
        card.className = "card card-interactive project-card";
        card.onclick = () => openFolderById(docSnap.id, data.name);
        card.innerHTML = `<h3>📁 ${data.name}</h3><p>${data.description || ""}</p>`;
        grid.appendChild(card);
      });
    });

    async function openFolderById(folderId, folderName) {
      document.getElementById("folderTitle").textContent = `📁 ${folderName}`;
      const fileList = document.getElementById("folderFiles");
      fileList.innerHTML = "";
      const snap = await getDocs(query(collection(db, `projects/${folderId}/files`), where("uid", "==", auth.currentUser.uid)));
      if (snap.empty) {
        fileList.innerHTML = '<p style="color:var(--color-text-muted);text-align:center;padding:1rem;">No files yet.</p>';
      } else {
        snap.forEach(d => {
          const f = d.data();
          const el = document.createElement("div");
          el.className = "file-item";
          el.innerHTML = `
            <div class="file-info" onclick="viewFile('${folderId}','${d.id}','${f.title}')">
              <strong>${f.title}</strong>
              <span>${f.content ? f.content.slice(0,80) + '…' : 'No content'}</span>
            </div>
            <button class="delete-file-btn" onclick="event.stopPropagation();deleteFile('${folderId}','${d.id}')" aria-label="Delete ${f.title}">🗑</button>`;
          fileList.appendChild(el);
        });
      }
      openModal("folderView");
    }
    window.openFolderById = openFolderById;
  </script>
</body>
</html>
