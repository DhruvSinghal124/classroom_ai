<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Settings – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        <h1 class="page-title">🔒 Privacy</h1>
        <p class="page-subtitle">Manage your data and privacy preferences.</p>
        <div class="tool-layout">
          <div class="tool-panel">
            <h2 class="tool-panel-header">Data Privacy</h2>
            <div class="card" style="padding:1.25rem;">
              <p class="text-muted" style="margin-bottom:1rem;">Control how your data is handled on Classroom.AI.</p>
              <div style="display:grid;gap:1rem;">
                <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                  <span>Share analytics</span>
                  <input type="checkbox" checked />
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                  <span>Public profile</span>
                  <input type="checkbox" />
                </label>
              </div>
              <button class="btn btn-primary" style="margin-top:1.5rem;width:100%;" onclick="showToast('Privacy settings updated.', 'success')">Save Changes</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { showToast } from "./js/ui.js"; initTheme(); initSidebar();
  </script>
</body>
</html>
