<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storage & Data – Classroom.AI</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-layout">
    <div class="app-main" id="main-content">
      <main class="app-content" role="main">
        <a href="settings.html" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">← Back to Settings</a>
        <h1 class="page-title">💾 Storage & Data</h1>
        <p class="page-subtitle">Manage your cloud storage and local data.</p>
        <div class="tool-layout">
          <div class="tool-panel">
            <h2 class="tool-panel-header">Storage Usage</h2>
            <div class="card" style="padding:1.5rem;">
              <div style="margin-bottom:1.5rem;">
                <div style="display:flex;justify-content:space-between;font-size:0.875rem;margin-bottom:0.5rem;">
                  <span>Cloud Storage</span>
                  <span>45.2 MB / 100 MB</span>
                </div>
                <div style="height:8px;background:var(--color-bg-primary);border-radius:4px;overflow:hidden;">
                  <div style="width:45%;height:100%;background:var(--gradient-primary);"></div>
                </div>
              </div>
              <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="showToast('Storage cleared successfully.', 'info')">Clear Local Cache</button>
            </div>
          </div>
          <div class="tool-panel">
            <h2 class="tool-panel-header">Export Data</h2>
            <div class="card" style="padding:1.5rem;">
              <p class="text-muted" style="font-size:0.875rem;margin-bottom:1.5rem;">Download all your saved projects and notes in a JSON format.</p>
              <button class="btn btn-primary btn-sm" style="width:100%;" onclick="showToast('Exporting data...', 'info')">Export All Data</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from "./js/sidebar.js"; import { initTheme } from "./js/theme.js";
    import { showToast } from "./js/ui.js"; initTheme(); initSidebar();
  </script>
</body>
</html>
